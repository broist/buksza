services:
  app:
    healthcheck:
      test: [CMD-SHELL, "php -r 'exit(is_file(\"/data/qa.sqlite\") ? 0 : 1);'"]
  caddy:
    ports: !override
      - "127.0.0.1:18082:80"
      - "127.0.0.1:18443:443"
    volumes:
      - type: bind
        source: ${BUKSZA_QA_CONFIG}/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
