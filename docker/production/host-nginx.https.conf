# Buksza installer managed: __BUKSZA_DOMAIN__
server {
    listen 80;
    server_name __BUKSZA_DOMAIN__;
    location ^~ /.well-known/acme-challenge/ {
        root __BUKSZA_ACME_ROOT__;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://__BUKSZA_DOMAIN__$request_uri; }
}
server {
    listen 443 ssl;
    server_name __BUKSZA_DOMAIN__;
    ssl_certificate __BUKSZA_CERT_ROOT__/live/__BUKSZA_CERT_NAME__/fullchain.pem;
    ssl_certificate_key __BUKSZA_CERT_ROOT__/live/__BUKSZA_CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / {
        proxy_pass http://127.0.0.1:__BUKSZA_HTTP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
